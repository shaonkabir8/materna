name: Release
# Publication workflow.
# Authenticates via OIDC Trusted Publishing (no NPM_TOKEN) and generates provenance.
# Gate 1: CI must have passed on the exact SHA.
# Gate 2: Re-test, guard against duplicate versions, then publish.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1 — CI success on the exact tagged SHA.
  # ---------------------------------------------------------------------------
  verify-ci:
    name: verify CI passed on ${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Require a successful CI run for this exact commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # ⚠️ VERIFY: Change 'ci.yml' if your CI workflow file is named differently (e.g., test.yml, build.yml)
          WORKFLOW_FILE: ci.yml
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          api() {
            curl -sS -f \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?head_sha=${SHA}&per_page=100"
          }
          for attempt in $(seq 1 20); do
            BODY="$(api)"
            SUCCESS="$(printf '%s' "$BODY" | jq -r --arg sha "$SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length')"
            PENDING="$(printf '%s' "$BODY" | jq -r --arg sha "$SHA" '[.workflow_runs[] | select(.head_sha == $sha and (.status == "queued" or .status == "in_progress"))] | length')"
            FAILED="$(printf '%s' "$BODY" | jq -r --arg sha "$SHA" '[.workflow_runs[] | select(.head_sha == $sha and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out"))] | length')"
            
            if [ "$SUCCESS" -gt 0 ]; then
              echo "::notice::CI is green on ${SHA}"
              exit 0
            fi
            if [ "$PENDING" -eq 0 ]; then
              echo "::error::no successful CI run exists for ${SHA} (failed=${FAILED})."
              exit 1
            fi
            sleep 30
          done
          echo "::error::timed out waiting for CI to report success on ${SHA}."
          exit 1

  # ---------------------------------------------------------------------------
  # Gate 2 — independent verification, guard, then publish.
  # ---------------------------------------------------------------------------
  publish:
    name: publish ${{ github.ref_name }}
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # Trusted Publishing / provenance
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: localeparity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d localeparity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/localeparity
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install a Trusted-Publishing-capable npm
        run: npm install --global npm@10

      - name: Report tool versions
        run: |
          node --version
          npm --version

      - name: Verify the tag matches package.json and lands on main
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$TAG" || { echo "::error::tag v$TAG does not match package.json version $VERSION"; exit 1; }
          test -z "$(git status --porcelain)" || { echo "::error::working tree is not clean"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tagged commit is not on main"; exit 1; }

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Run the test suite against a live PostgreSQL server
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee tap.txt

      - name: Assert no test was skipped
        shell: bash
        run: |
          node -e '
            const text = require("node:fs").readFileSync("tap.txt", "utf8");
            const match = text.match(/^(?:#|\u2139) skipped (\d+)$/m);
            if (!match) { console.error("no TAP summary found"); process.exit(1); }
            if (match[1] !== "0") { console.error(`skipped ${match[1]} test(s)`); process.exit(1); }
            console.log("skipped 0");
          '

      - name: Validate the package tarball inventory
        run: npm pack --dry-run

      # NEW: Guard against duplicate versions to fix the "already published" failure
      - name: Check if version already exists on npm
        id: check
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if npm view "materna@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::Version $VERSION already exists on npm. Skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with provenance
        if: steps.check.outputs.skip == 'false'
        run: npm publish --provenance --access public

      - name: Verify the published artifact in the registry
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          for attempt in 1 2 3 4 5 6; do
            if npm view "materna@$VERSION" version >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          echo "version: $(npm view "materna@$VERSION" version)"
          echo "integrity: $(npm view "materna@$VERSION" dist.integrity)"
          test "$(npm view "materna@$VERSION" version)" = "$VERSION"
