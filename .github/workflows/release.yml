name: Release

# Publication workflow.
#
# There is deliberately no NPM_TOKEN anywhere in this repository. The job
# authenticates to the registry with a short-lived OIDC token exchanged for
# publish rights by npm's Trusted Publishing, and it generates a provenance
# attestation that binds the published tarball to this workflow, this commit and
# this repository.
#
# Prerequisites, all of which must be satisfied by a human before this workflow
# can publish:
#
#   1. npm >= 11.5.1 and Node >= 22.14.0 in the runner (installed below).
#   2. A Trusted Publisher configured on the npm package settings for
#      owner `shaonkabir8`, repository `materna`, workflow `release.yml`,
#      environment `npm-publish`.
#   3. `repository.url` in package.json exactly equal to
#      https://github.com/shaonkabir8/materna — provenance is refused otherwise.
#   4. The `npm-publish` environment protected by a required reviewer, so a tag
#      push alone cannot publish.
#
# TWO INDEPENDENT GATES, in this order:
#
#   gate 1 (verify-ci)  CI must have REPORTED SUCCESS on this exact commit SHA.
#   gate 2 (publish)    the tagged tree is re-tested here, then published.
#
# Gate 1 exists because tag ancestry is not evidence. `git merge-base
# --is-ancestor` proves a tag points at a commit that is contained in main; it
# says nothing about whether any test ever ran on that commit. A commit pushed
# directly to main with CI red, or a commit whose CI never started, is an
# ancestor of main. So the release path queries the Actions API for a completed,
# successful run of this repository's CI workflow at this exact SHA and refuses
# to continue otherwise.

on:
  push:
    tags:
      - 'v*.*.*'

# Workflow-level default is read-only. `id-token: write` is granted to the
# publish job alone, because job-level `permissions` replaces the workflow-level
# map rather than merging with it.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1 — CI success on the exact tagged SHA.
  # ---------------------------------------------------------------------------
  verify-ci:
    name: verify CI passed on ${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # read workflow runs; nothing is written
      checks: read

    steps:
      - name: Require a successful CI run for this exact commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: ci.yml
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          api() {
            curl -sS -f \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?head_sha=${SHA}&per_page=100"
          }

          # A tag pushed the instant a merge lands can race CI. Wait for a
          # verdict instead of failing on "still running" — but never treat
          # silence as success: after the bounded wait, absence of a successful
          # run is a hard failure.
          for attempt in $(seq 1 20); do
            BODY="$(api)"
            SUCCESS="$(printf '%s' "$BODY" | jq -r --arg sha "$SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length')"
            PENDING="$(printf '%s' "$BODY" | jq -r --arg sha "$SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha and (.status == "queued" or .status == "in_progress"))] | length')"
            FAILED="$(printf '%s' "$BODY" | jq -r --arg sha "$SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out"))] | length')"

            echo "attempt ${attempt}: success=${SUCCESS} pending=${PENDING} failed=${FAILED}"
            printf '%s' "$BODY" | jq -r '.workflow_runs[] | "  run \(.id) event=\(.event) status=\(.status) conclusion=\(.conclusion // "-") sha=\(.head_sha) \(.html_url)"'

            if [ "$SUCCESS" -gt 0 ]; then
              echo "::notice::CI is green on ${SHA}"
              exit 0
            fi
            if [ "$PENDING" -eq 0 ]; then
              # Nothing is running, so waiting longer cannot change the answer.
              echo "::error::no successful CI run exists for ${SHA} (failed=${FAILED}). A tag on an ancestor of main is not evidence that tests passed."
              exit 1
            fi
            sleep 30
          done

          echo "::error::timed out waiting for CI to report success on ${SHA}. Nothing was published."
          exit 1

  # ---------------------------------------------------------------------------
  # Gate 2 — independent verification of the tagged tree, then publish.
  # ---------------------------------------------------------------------------
  publish:
    name: publish ${{ github.ref_name }}
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # Trusted Publishing / provenance; published only after verify-ci

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: localeparity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d localeparity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/localeparity

    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted Publishing requires npm CLI >= 11.5.1; the npm bundled with the
      # runner image is older than that.
      - name: Install a Trusted-Publishing-capable npm
        run: npm install --global npm@11.21.2

      - name: Report tool versions
        run: |
          node --version
          npm --version

      - name: Verify the tag matches package.json and lands on main
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$TAG" || {
            echo "::error::tag v$TAG does not match package.json version $VERSION"
            exit 1
          }
          test -z "$(git status --porcelain)" || {
            echo "::error::working tree is not clean"
            exit 1
          }
          git fetch --no-tags origin main
          # Ancestry only. It is NOT proof of CI success — that is verify-ci's
          # job, and this job does not run without it.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main"
            exit 1
          }
          if npm view "materna@$VERSION" version >/dev/null 2>&1; then
            echo "::error::materna@$VERSION already exists on the registry; a published version is never overwritten"
            exit 1
          fi
          echo "releasing materna@$VERSION from $GITHUB_SHA"

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Run the test suite against a live PostgreSQL server
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee tap.txt

      - name: Assert no test was skipped
        shell: bash
        run: |
          node -e '
            const text = require("node:fs").readFileSync("tap.txt", "utf8");
            // Node <= 22 prints the summary as "# skipped N"; Node >= 24 prints
            // "\u2139 skipped N". Both must be recognised, otherwise this gate
            // fails closed on the newer runtimes and blocks a valid release.
            const match = text.match(/^(?:#|\u2139) skipped (\d+)$/m);
            if (!match) { console.error("no TAP summary found"); process.exit(1); }
            if (match[1] !== "0") { console.error(`skipped ${match[1]} test(s) \u2014 refusing to publish unverified code`); process.exit(1); }
            console.log("skipped 0");
          '

      - name: Validate the package tarball inventory
        run: npm pack --dry-run

      - name: Publish with provenance
        run: npm publish --provenance --access public

      # Exit code 0 from `npm publish` is not proof that the registry holds the
      # artifact that was reviewed: the registry is the authority, so it is
      # queried for the version, the integrity and the repository it recorded.
      - name: Verify the published artifact in the registry
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          for attempt in 1 2 3 4 5 6; do
            if npm view "materna@$VERSION" version >/dev/null 2>&1; then break; fi
            sleep 10
          done
          echo "version:   $(npm view "materna@$VERSION" version)"
          echo "integrity: $(npm view "materna@$VERSION" dist.integrity)"
          echo "repo:      $(npm view "materna@$VERSION" repository.url)"
          echo "license:   $(npm view "materna@$VERSION" license)"
          test "$(npm view "materna@$VERSION" version)" = "$VERSION"
